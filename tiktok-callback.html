<!doctype html><html lang="pt-BR"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Login TikTok · Artigo 1910</title>
<style>body{background:#0B0B0D;color:#EDE8DF;font:17px/1.6 system-ui,sans-serif;max-width:760px;margin:0 auto;padding:40px 16px}
h1 span{color:#7B2CFF}code{display:block;background:#1a1a1e;padding:14px;border-radius:6px;word-break:break-all;margin:12px 0}
button{background:#7B2CFF;color:#fff;border:0;padding:10px 18px;border-radius:6px;font-size:16px;cursor:pointer}small{color:#6E6A66}</style></head>
<body><h1>Artigo <span>1910</span></h1>
<p id="msg">Autorização recebida. Copie o código abaixo e cole onde o programa pedir:</p>
<code id="code">—</code><button onclick="navigator.clipboard.writeText(document.getElementById('code').textContent)">Copiar código</button>
<p><small>O código expira em poucos minutos e só funciona uma vez.</small></p>
<script>
const q=new URLSearchParams(location.search);
if(q.get('code')){document.getElementById('code').textContent=q.get('code');}
else{document.getElementById('msg').textContent='Nenhum código recebido'+(q.get('error')?' (erro: '+q.get('error')+')':'')+'.';}
</script></body></html>
